[project]
name = "ml-homework"
version = "0.1.0"
description = "Homework notebooks for mathematics, statistics, EDA, and machine learning"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ipykernel>=7.3,<8",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    "numpy>=2.4,<3",
    "pandas>=3.0,<4",
    "plotly>=6.9.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.7,<2",
    "scipy>=1.17,<2",
    "seaborn>=0.13,<0.14",
    "statsmodels>=0.14,<0.15",
    "sympy>=1.14,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black[jupyter]>=26.3,<27",
    "mypy>=1.19,<2",
    "pandas-stubs>=3.0,<4",
    "pre-commit>=4.5,<5",
    "pytest>=9.0,<10",
    "ruff>=0.14,<0.15",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F811", "F841"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.hatch.build.targets.wheel]
packages = ["src/ml_homework"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*bool was deprecated.*:matplotlib.MatplotlibDeprecationWarning:seaborn.categorical",
]
